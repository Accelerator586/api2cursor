services:
  api2cursor:
    build: .
    ports:
      - "127.0.0.1:${PROXY_PORT:-3029}:${PROXY_PORT:-3029}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PROXY_PORT:-3029}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
