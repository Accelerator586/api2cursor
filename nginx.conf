worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api2cursor_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api2cursor_login:10m rate=5r/m;

    upstream api2cursor_upstream {
        server 127.0.0.1:3029;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name your.domain.example;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name your.domain.example;

        ssl_certificate /etc/letsencrypt/live/your.domain.example/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location /api/admin/login {
            limit_req zone=api2cursor_login burst=10 nodelay;
            proxy_pass http://api2cursor_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            limit_req zone=api2cursor_api burst=100 nodelay;
            proxy_pass http://api2cursor_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
